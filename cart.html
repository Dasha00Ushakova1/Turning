<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Shop — Корзина</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="screen screen--active">
        <header class="app-header">
            <button id="back-to-catalog" class="btn btn--ghost" type="button">← В каталог</button>
            <h2 class="app-header__title">Корзина</h2>
            <span id="user-name" class="user-box__name"></span>
        </header>

        <main class="app-main">
            <table class="data-table" id="cart-table">
                <thead class="data-table__head">
                    <tr>
                        <th>Код</th>
                        <th>Название</th>
                        <th>Размер</th>
                        <th>Цена</th>
                        <th>Количество</th>
                        <th>Сумма</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody class="data-table__body" id="cart-body"></tbody>
            </table>

            <p id="cart-empty" class="data-table__empty" hidden>
                Корзина пуста. Перейдите в <a href="catalog.html">каталог</a>, чтобы добавить товары.
            </p>

            <div class="cart-summary" id="cart-summary" hidden>
                <div class="cart-summary__row">
                    <span>Итого:</span>
                    <b id="cart-total">0.00 ₽</b>
                </div>
                <div class="cart-summary__actions">
                    <button id="checkout-btn" class="btn btn--primary" type="button">Оформить заказ</button>
                    <button id="clear-cart-btn" class="btn btn--ghost btn--dark" type="button">Очистить корзину</button>
                </div>
            </div>
        </main>
    </section>

    <div id="modal" class="modal" hidden>
        <div class="modal__window">
            <h3 id="modal-title" class="modal__title"></h3>
            <p id="modal-text" class="modal__text"></p>
            <div class="modal__actions">
                <button id="modal-ok" class="btn btn--primary" type="button">OK</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>

    <script src="./sql-wasm.js"></script>
    <script src="./db.js"></script>
    <script src="./app-cart.js"></script>
</body>
</html>
