<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Shop — Заказ</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="screen screen--active">
        <header class="app-header">
            <button id="back-to-orders" class="btn btn--ghost" type="button">← К заказам</button>
            <h2 id="page-title" class="app-header__title">Заказ</h2>
            <div class="user-box">
                <span id="user-name" class="user-box__name"></span>
                <span id="user-role" class="user-box__role"></span>
            </div>
        </header>

        <main class="app-main">
            <div id="order-wrapper">
                <p class="data-table__empty">Загрузка…</p>
            </div>
        </main>
    </section>

    <div id="modal" class="modal" hidden>
        <div class="modal__window">
            <h3 id="modal-title" class="modal__title"></h3>
            <p id="modal-text" class="modal__text"></p>
            <div class="modal__actions">
                <button id="modal-ok" class="btn btn--primary" type="button">OK</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>

    <script src="./sql-wasm.js"></script>
    <script src="./db.js"></script>
    <script src="./app-order.js"></script>
</body>
</html>
