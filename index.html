<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Shop — Каталог товаров</title>
    <link rel="stylesheet" href="./style.css">
   <script src="./sql-wasm.js"></script>
   <script src="./app.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <img src="./logo.svg" alt="Логотип Turning Shop" class="logo__image">
            <h1 class="logo__title">Turning Shop</h1>
        </div>
        <nav class="app-nav">
            <ul class="app-nav__list">
                <li class="app-nav__item"><a class="app-nav__link" href="#catalog">Каталог</a></li>
                <li class="app-nav__item"><a class="app-nav__link" href="#orders">Заказы</a></li>
            </ul>
        </nav>
    </header>

    <main class="app-main">
        <section id="catalog" class="section">
            <h2 class="section__title">Каталог товаров</h2>

            <table class="data-table" id="catalog-table">
                <thead class="data-table__head">
                    <tr>
                        <th>Код</th>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Цена со скидкой</th>
                        <th>Количество</th>
                        <th>Наличие</th>
                    </tr>
                </thead>
                <tbody class="data-table__body" id="catalog-body">
                    <tr><td colspan="6" class="data-table__empty">Загрузка…</td></tr>
                </tbody>
            </table>
        </section>

        <section id="orders" class="section">
            <h2 class="section__title">Заказы</h2>

            <table class="data-table" id="orders-table">
                <thead class="data-table__head">
                    <tr>
                        <th>Код заказа</th>
                        <th>Клиент</th>
                        <th>Дата заказа</th>
                        <th>Общая стоимость</th>
                    </tr>
                </thead>
                <tbody class="data-table__body" id="orders-body">
                    <tr><td colspan="4" class="data-table__empty">Загрузка…</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Turning Shop - спасите</p>
    </footer>
</body>
</html>
