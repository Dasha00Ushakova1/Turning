<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Shop — Вход</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="screen screen--active">
        <div class="login-card">
            <h1 class="login-card__title">Turning Shop</h1>
            <p class="login-card__subtitle">Вход в систему</p>

            <form id="login-form" class="login-form" novalidate>
                <label class="field">
                    <span class="field__label">Логин</span>
                    <input id="login-input" class="field__input" type="text"
                           placeholder="Введите логин" autocomplete="off">
                    <span class="field__error" id="login-error"></span>
                </label>
                <button class="btn btn--primary" type="submit">Войти</button>
            </form>

            <p class="login-card__hint">
                Логины пользователей: <b>yuder</b>, <b>kishiar</b>, <b>ever</b>, <b>hinn</b>, <b>finn</b>
               Логин админа: <b>inon</b>
                Логин менеджера <b>mick</b>
            </p>
        </div>
    </section>

    <div id="modal" class="modal" hidden>
        <div class="modal__window">
            <h3 id="modal-title" class="modal__title"></h3>
            <p id="modal-text" class="modal__text"></p>
            <div class="modal__actions">
                <button id="modal-ok" class="btn btn--primary" type="button">OK</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>

    <script src="./db.js"></script>
    <script src="./app-login.js"></script>
</body>
</html>
