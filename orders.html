<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Shop — Заказы</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="screen screen--active">
        <header class="app-header">
            <button id="back-to-catalog" class="btn btn--ghost" type="button">← В каталог</button>
            <h2 id="page-title" class="app-header__title">Заказы</h2>
            <div class="user-box">
                <span id="user-name" class="user-box__name"></span>
                <span id="user-role" class="user-box__role"></span>
            </div>
        </header>

        <main class="app-main">
            <div class="toolbar">
                <input id="orders-search" class="field__input" type="text"
                       placeholder="Поиск...">
            </div>

            <table class="data-table">
                <thead class="data-table__head">
                    <tr>
                        <th>Код</th>
                        <th>Дата</th>
                        <th id="col-customer">Клиент</th>
                        <th>Состав</th>
                        <th>Сумма</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody class="data-table__body" id="orders-body"></tbody>
            </table>

            <p id="orders-empty" class="data-table__empty" hidden>Заказов нет</p>
        </main>
    </section>

    <div id="modal" class="modal" hidden>
        <div class="modal__window">
            <h3 id="modal-title" class="modal__title"></h3>
            <p id="modal-text" class="modal__text"></p>
            <div class="modal__actions">
                <button id="modal-ok" class="btn btn--primary" type="button">OK</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>

    <script src="./sql-wasm.js"></script>
    <script src="./db.js"></script>
    <script src="./app-orders.js"></script>
</body>
</html>
